# Render Blueprint — Estagionauta API. O frontend continua na Vercel.
# No Render: New → Blueprint → selecione este repositório.
services:
  - type: web
    name: estagionauta-api
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm --prefix api ci --include=dev && npm --prefix api run build
    startCommand: npm --prefix api start
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - api/**
        - shared/**
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "3001"
      - key: CLIENT_URL
        value: https://estagionauta.com.br
      - key: BREVO_SENDER_EMAIL
        value: contato@estagionauta.com.br
      # Segredos configurados no painel do Render (Environment)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: BYOK_ENCRYPTION_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ASTRONAUTA_ASSINATURA
        sync: false
      - key: STRIPE_PRICE_COSMONAUTA_ASSINATURA
        sync: false
      - key: STRIPE_PRICE_ASTRONAUTA_AVULSO
        sync: false
      - key: STRIPE_PRICE_COSMONAUTA_AVULSO
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: GOOGLE_MAPS_BACKEND_KEY
        sync: false
