<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estagionauta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Estrelas de fundo */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 160px 30px, #fff, transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: twinkle 4s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        /* Container do astronauta */
        .astronaut-container {
            position: relative;
            z-index: 2;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(-5deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
        }

        /* Astronauta */
        .astronaut {
            width: 200px;
            height: 250px;
            position: relative;
        }

        /* Capacete */
        .helmet {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #f0f0f0 0%, #d0d0d0 100%);
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            border: 8px solid #888;
            box-shadow: 
                inset 0 0 20px rgba(255,255,255,0.3),
                0 0 30px rgba(255,255,255,0.2);
        }

        .helmet::before {
            content: '';
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, transparent 100%);
            border-radius: 50%;
            position: absolute;
            top: 10px;
            left: 10px;
        }

        /* Rosto */
        .face {
            width: 60px;
            height: 60px;
            background: #ffdbac;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .eyes {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        .eye {
            width: 8px;
            height: 8px;
            background: #333;
            border-radius: 50%;
        }

        .mouth {
            width: 20px;
            height: 10px;
            border: 2px solid #333;
            border-top: none;
            border-radius: 0 0 20px 20px;
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Corpo */
        .body {
            width: 140px;
            height: 100px;
            background: linear-gradient(135deg, #f0f0f0 0%, #d0d0d0 100%);
            border-radius: 20px;
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            border: 4px solid #888;
        }

        .chest-panel {
            width: 60px;
            height: 40px;
            background: #333;
            border-radius: 8px;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .chest-panel::before {
            content: '';
            width: 10px;
            height: 10px;
            background: #00ff00;
            border-radius: 50%;
            position: absolute;
            top: 8px;
            left: 10px;
            box-shadow: 
                15px 0 0 #ff0000,
                30px 0 0 #0080ff;
        }

        /* Braços */
        .arm {
            width: 40px;
            height: 80px;
            background: linear-gradient(135deg, #f0f0f0 0%, #d0d0d0 100%);
            border-radius: 20px;
            position: absolute;
            top: 110px;
            border: 3px solid #888;
        }

        .arm.left {
            left: 10px;
            transform: rotate(-20deg);
            animation: wave-left 3s ease-in-out infinite;
        }

        .arm.right {
            right: 10px;
            transform: rotate(20deg);
            animation: wave-right 3s ease-in-out infinite;
        }

        @keyframes wave-left {
            0%, 100% { transform: rotate(-20deg); }
            50% { transform: rotate(-40deg); }
        }

        @keyframes wave-right {
            0%, 100% { transform: rotate(20deg); }
            50% { transform: rotate(40deg); }
        }

        /* Pernas */
        .leg {
            width: 35px;
            height: 70px;
            background: linear-gradient(135deg, #f0f0f0 0%, #d0d0d0 100%);
            border-radius: 15px;
            position: absolute;
            top: 180px;
            border: 3px solid #888;
        }

        .leg.left {
            left: 60px;
        }

        .leg.right {
            right: 60px;
        }

        /* Botas */
        .boot {
            width: 45px;
            height: 25px;
            background: #333;
            border-radius: 15px;
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Texto */
        .title {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            0% { text-shadow: 0 0 20px rgba(255,255,255,0.5); }
            100% { text-shadow: 0 0 30px rgba(255,255,255,0.8); }
        }

        /* Partículas flutuantes */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
            animation: particle-float 8s linear infinite;
        }

        .particle:nth-child(1) { left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 20%; animation-delay: 2s; }
        .particle:nth-child(3) { left: 30%; animation-delay: 4s; }
        .particle:nth-child(4) { left: 70%; animation-delay: 1s; }
        .particle:nth-child(5) { left: 80%; animation-delay: 3s; }
        .particle:nth-child(6) { left: 90%; animation-delay: 5s; }

        @keyframes particle-float {
            0% { 
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { 
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>

    <div class="astronaut-container">
        <div class="astronaut">
            <div class="helmet">
                <div class="face">
                    <div class="eyes">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                    <div class="mouth"></div>
                </div>
            </div>
            
            <div class="body">
                <div class="chest-panel"></div>
            </div>
            
            <div class="arm left"></div>
            <div class="arm right"></div>
            
            <div class="leg left">
                <div class="boot"></div>
            </div>
            <div class="leg right">
                <div class="boot"></div>
            </div>
        </div>
    </div>

    <div class="title">Estagionauta</div>
</body>
</html>
