name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Project
        run: npm run build

  test-backend:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    env:
      PORT: '3001'
      NODE_ENV: 'test'
      SUPABASE_URL: 'https://mock.supabase.co'
      SUPABASE_SERVICE_ROLE_KEY: 'mock-service-role-key'
      GEMINI_API_KEY: 'mock-gemini-key'
      STRIPE_SECRET_KEY: 'mock-stripe-key'
      STRIPE_WEBHOOK_SECRET: 'mock-webhook-secret'
      STRIPE_PRICE_ASTRONAUTA_ASSINATURA: 'price_mock_1'
      STRIPE_PRICE_COSMONAUTA_ASSINATURA: 'price_mock_2'
      STRIPE_PRICE_ASTRONAUTA_AVULSO: 'price_mock_3'
      STRIPE_PRICE_COSMONAUTA_AVULSO: 'price_mock_4'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd api
          npm ci

      - name: Build Backend
        run: |
          cd api
          npm run build

      - name: Run Backend Tests
        run: |
          cd api
          npm run test
